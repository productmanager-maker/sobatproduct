services:
  sobatproduct:
    build: .
    container_name: sobatproduct
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./index.js:/app/index.js
      - ./sidcoreCommands.js:/app/sidcoreCommands.js
      - ./google-credentials.json:/app/google-credentials.json:ro
      - ./data:/app/data
      - /home/product/sid-core-automation:/app/sid-core-automation:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
